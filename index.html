<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Kak Rufaida! 🎉</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #7f8c8d;
            font-size: 14px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 15px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Heyyo Kak Rufaida Kariemah 👋</h1>
    <p>Ada pesan khusus yang mau gua sampaikan hari ini...</p>
    <button onclick="bukaPesan()">Buka Pesan 🎁</button>
</div>

<script>
async function bukaPesan() {
    await Swal.fire({
        title: 'HAPPY BIRTHDAY! 🎉',
        text: 'Gua mau nyinggung dikit nih awal-awal kita deket. Waktu itu... gua inget banget ada dua orang yang dateng ke kamar sepuluh, dan salah satunya lu. Gua gak tahu kapan persisnya hal itu bisa bikin kita jadi sedeket ini.',
        confirmButtonText: 'Lanjut ➡️'
    });

    await Swal.fire({
        text: 'Gua tipe orang yang gampang ngelupain hal-hal yang seharusnya diinget, soalnya dulu gua ngira kejadian itu cuma lewat doang dan gak bakal berpengaruh apa-apa di hidup gua. Ternyata gua salah besar...',
        confirmButtonText: 'Lanjut ➡️'
    });

    await Swal.fire({
        text: 'Entah apa yang bikin gua ikut MTK sama lu, entah apa yang bikin lu ke kamar gua buat mainin HP sama gitar, gua bahkan gak tahu mana yang duluan terjadi. Tapi inti dari semua itu... gua ngerasa seneng banget bisa kenal sama lu. Ke berapa kalinya ya gua ngomong gitu di setiap ultah lu? Gua bahkan lupa.',
        confirmButtonText: 'Lanjut ➡️'
    });

    await Swal.fire({
        text: 'Seiring berjalannya waktu, gua ngeliat lu jauuuhhhh banget, tapi gua seneng Tuhan selalu ngasih hal yang baik ke lu. Walaupun kalau main sama gua tuh kesannya kek "apa dah?" atau "gini doang?", dan ya... banyak lagi lah yang gak bisa keucap.',
        confirmButtonText: 'Lanjut ➡️'
    });

    await Swal.fire({
        text: 'Tapi serius, jujur aja nih, gua pengen banget kalau main sama lu tuh bisa nyamain energi aktif yang lu punya biar kita bisa nyambung obrolannya, ketawa tanpa sebab kek orang-orang, dan ngungkapin hal random biar obrolan jadi lebih ringan. Tapi gua selalu berpikir, kalau gua lakuin itu, bakal kerasa aneh dan kek bukan gua. Ngapain juga gua ngikutin orang lain, hehe.',
        confirmButtonText: 'Lanjut ➡️'
    });

    await Swal.fire({
        text: 'Tapi makasih banget ya udah ngasih kesempatan buat gua hadir di cerita perjalanan hidup lu, karena dari situ gua jadi belajar banyak hal. Gua cuma berharap lu bisa mendapatkan hal yang lebih baik buat kedepannya. Maaf ya kalau kesannya gua terbilang mau ikut campur banget di cerita hidup lu.',
        confirmButtonText: 'Lanjut ➡️'
    });

    await Swal.fire({
        text: 'Semoga tahun ini lu bisa mendapatkan hal-hal yang lu inginkan. Gua tahu lu gak banyak berharap tentang apapun itu, tapi lu harus inget "ketika seseorang tidak berharap, orang itu juga jangan terlalu keras memaksakan sesuatu. Ketika seseorang tidak punya hal yang ingin dituju, sering kali itu membuatnya kehilangan arah dan tidak tahu batasan". Gua percaya lu bisa ngatasin itu karena gua ngeliat banyak hal yang udah lu laluin. Kalau lu bingung harus ngapain, tenang aja, masih ada Tuhan yang selalu nampung keluh kesah lu yang orang lain gak tahu.',
        confirmButtonText: 'Lanjut ➡️'
    });

    await Swal.fire({
        text: 'Kadang dunia selalu memberikan banyak hal yang membuat kita ngerasa gak nyaman. Tapi mungkin, justru dari hal-hal kek gitu kita perlahan berkembang menjadi seorang yang lebih kuat. Kalau kita terus ada di tempat yang nyaman, mungkin kita gak bakal tahu sejauh apa kita sebenarnya bisa bertumbuh.',
        confirmButtonText: 'Lanjut ➡️'
    });

    await Swal.fire({
        text: 'Gua harap setiap kali lu lagi ngadepin suatu hal yang gak mudah, lu bisa tetap inget hal itu ya... Tapi kalau suatu saat lu mikir bahwa bersikap positif aja gak cukup, atau lu ngerasa terlalu berat buat menghadapinya sendiri, ingat kalau masih ada Tuhan yang bisa jadi tempat cerita terbaik.',
        confirmButtonText: 'Lanjut ➡️'
    });

    await Swal.fire({
        text: 'Gua juga berharap semua hal baik terjadi ke lu di manapun dan kapanpun itu. Gua gak bakal berhenti ngucapin ini karena gua tahu lu bener-bener pantes. Dan kalaupun gua bisa memberikan hal yang baik itu, gua mau banget mengusahakannya, Kak. Gua mau banget jadi orang yang bisa memberikan hal positif buat lu.',
        confirmButtonText: 'Lanjut ➡️'
    });

    Swal.fire({
        title: 'Be happy always ya, Kak! ✨',
        text: 'Jadi, tetap semangat terus ya sama semua hal yang lu lakuin! Gua selalu ada di belakang lu, meskipun bukan semata-mata karena kita pernah deket.',
        icon: 'success',
        confirmButtonText: 'Terima Kasih ❤️'
    });
}
</script>

</body>
</html>
